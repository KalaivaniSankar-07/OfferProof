<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Offer - OfferProof</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<nav>
    <a class="logo" href="/">
        🛡 OfferProof
    </a>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/verify">Verify Offer</a>
        <a href="/report">Report Scam</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/history">History</a>
    </div>
</nav>

<section class="page-wrap">

    <div class="page-header">

        <p class="tag">
            SMART OFFER VERIFICATION
        </p>

        <h1>
            Verify Your Offer
        </h1>

        <p>
            Enter the offer details or upload your
            offer letter PDF for analysis.
        </p>

    </div>

    <form
        class="form-card"
        method="POST"
        action="/analyze"
        enctype="multipart/form-data"
    >

        <label for="company">
            Company Name
        </label>

        <input
            type="text"
            id="company"
            name="company"
            placeholder="Example: ABC Technologies"
            required
        >

        <label for="email">
            Recruiter Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Example: hr@company.com"
        >

        <label for="phone">
            Recruiter Phone
        </label>

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Enter recruiter phone number"
        >

        <label for="website">
            Company Website
        </label>

        <input
            type="text"
            id="website"
            name="website"
            placeholder="https://company.com"
        >

        <label for="payment_id">
            Payment / UPI ID (if requested)
        </label>

        <input
            type="text"
            id="payment_id"
            name="payment_id"
            placeholder="Example: recruiter@upi"
        >

        <label for="message">
            Offer Message
        </label>

        <textarea
            id="message"
            name="message"
            placeholder="Paste the internship or job offer message here..."
        ></textarea>

        <label for="offer_pdf">
            Upload Offer Letter (PDF)
        </label>

        <input
            type="file"
            id="offer_pdf"
            name="offer_pdf"
            accept=".pdf,application/pdf"
        >

        <button
            class="analyze-btn"
            type="submit"
        >
            Analyze Offer
        </button>

        <p class="privacy-note">
            🔐 OfferProof masks personal identifiers and
            uses secure fingerprints for repeat-scam matching.
        </p>

    </form>

</section>

</body>
</html>
